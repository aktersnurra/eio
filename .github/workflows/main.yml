name: Main workflow

on:
  pull_request:
  push:

jobs:
  build:
    env:
      EIO_BACKEND: posix
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
        ocaml-compiler:
          - 5.4.0
        local-packages:
          - eio eio_posix eio_main

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-local-packages:
          opam-disable-sandboxing: true

      - run: opam --cli=2.1 pin -yn --with-version=dev .
      - run: opam install ${{ matrix.local-packages }} --deps-only --with-test
      - name: Build POSIX workspace
        run: bash .github/ci/posix.sh build
      - name: Run full POSIX suite
        run: bash .github/ci/posix.sh test
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posix-${{ matrix.os }}
          path: ci-logs/
          if-no-files-found: warn
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          opam-pin: false
          ocaml-compiler: 5
      # --with-version=dev is not available, and --with-test also tries running tests for packages (like MDX) which fail...
      - run: | 
          opam pin -yn eio.dev .
          opam pin -yn eio_windows.dev .
          opam pin -yn eio_main.dev .
          opam install eio eio_windows eio_main --deps-only --with-test
      - run: opam exec -- dune build
      - run: opam exec -- dune runtest
      - run: opam exec -- dune exec -- ./examples/net/main.exe
      - run: opam exec -- dune exec -- ./examples/fs/main.exe
  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Build the Docker image
      run: docker build .
